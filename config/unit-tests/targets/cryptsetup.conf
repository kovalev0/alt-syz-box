#
# Copyright (C) 2026 Vasiliy Kovalev <kovalev@altlinux.org>
#
# Unit-tests target: cryptsetup -- LUKS/dm-crypt disk-encryption userspace
# (cryptsetup, veritysetup, integritysetup + libcryptsetup). Userspace
# counterpart of the dm-secdel module target: dm-secdel is an out-of-tree
# device-mapper module, cryptsetup sets up the in-kernel dm-crypt/dm-verity/
# dm-integrity targets from userspace. Userspace package => gcc --coverage
# (TARGET_COVERAGE_MODE=userspace).
#
# What is measured: libcryptsetup (LUKS1/LUKS2 on-disk format, keyslots, PBKDF,
# the crypto backend, reencryption, token/keyring handling) and the CLI front
# ends in src/ -- exercised against real dm-crypt/dm-verity/dm-integrity mappings
# on loop devices inside the guest.
#
# Tests: the project's OWN upstream suite (the TESTS of its autotools
# "make check"). target_build compiles the tools AND the C test programs
# (make -C tests check-programs) with --coverage on the HOST, so the guest needs
# no compiler; the driver runs the prebuilt programs and shell testcases.
#
# Source repository: ALT gear gears/c/cryptsetup.git (gears are keyed by first
# letter -- cryptsetup => c/, NOT s/). Upstream (v2.7.4) is committed in a
# cryptsetup/ subdirectory which ALREADY contains ALT's downstream changes (the
# gear "diff:" rule regenerates the spec Patch0 from exactly that subtree), so the
# checked-out cryptsetup/ IS the patched source -- built as-is, no re-apply.
#
# Contract: see config/unit-tests/README.md. Sourced by 06-run-unit-tests.sh
# with $TARGET_SRC = the cloned tree and $KERNEL_BUILD_DIR = the gcov kernel.

TARGET_NAME="cryptsetup"
TARGET_GIT_URL="git://git.altlinux.org/gears/c/cryptsetup.git"
TARGET_GIT_REF="p11"

# lcov --extract scope: $TARGET_SRC is .../unit-tests/cryptsetup/src, so every
# source path contains "cryptsetup"; /usr/include headers are dropped.
TARGET_COV_PATTERN="cryptsetup"

TARGET_GUEST_TEST="cryptsetup.sh"

# Kernel the tests need: device-mapper crypto/verity/integrity targets on loop
# devices, plus the LUKS crypto algorithms + the userspace crypto API (AF_ALG)
# and the kernel keyring. NOTE: do NOT enable CONFIG_SCSI_DEBUG here -- built in,
# scsi_debug grabs /dev/sda at boot and shifts the real root disk to /dev/sdb,
# so root=/dev/sda3 panics. The handful of tests that want scsi_debug self-skip
# without it.
TARGET_KCONFIG="BLK_DEV_DM DM_CRYPT DM_VERITY DM_INTEGRITY DM_ZERO DM_BUFIO \
BLK_DEV_LOOP BLK_DEV_INTEGRITY KEYS ENCRYPTED_KEYS \
CRYPTO_USER_API CRYPTO_USER_API_HASH CRYPTO_USER_API_SKCIPHER CRYPTO_USER \
CRYPTO_AES CRYPTO_CBC CRYPTO_XTS CRYPTO_ECB CRYPTO_LRW CRYPTO_ESSIV \
CRYPTO_SHA1 CRYPTO_SHA256 CRYPTO_SHA512 CRYPTO_SHA3 CRYPTO_WP512 \
CRYPTO_HMAC CRYPTO_CMAC CRYPTO_XCBC CRYPTO_CRC32C CRYPTO_CRCT10DIF \
CRYPTO_CHACHA20 CRYPTO_POLY1305 CRYPTO_ADIANTUM CRYPTO_SERPENT CRYPTO_TWOFISH \
CRYPTO_AEGIS128 CRYPTO_GCM CRYPTO_CTR"

# Guest runtime libraries the shipped binaries link against + tools the shell
# tests call (dmsetup, keyctl). ALT package names (note libjson-c5, not
# libjson-c). Base/util-linux already provide libuuid/libblkid/libcrypto.
TARGET_EXTRA_PACKAGES="device-mapper libdevmapper libjson-c5 libpopt \
libargon2 libuuid libblkid keyutils libpasswdqc openssl"

TARGET_COVERAGE_MODE="userspace"

# Build dependencies this package needs IN THE CONTAINER, taken from the ALT
# spec's BuildRequires (openssl crypto backend + selinux enabled + passwdqc).
# gettext-tools provides autopoint (the spec's %autoreconf needs it) and
# asciidoctor builds the man pages. Installed first; idempotent.
CRYPTSETUP_BUILD_REQUIRES="libdevmapper-devel libpopt-devel libuuid-devel \
libudev-devel libpasswdqc-devel libjson-c-devel libargon2-devel \
libsystemd-devel libblkid-devel libssh-devel libselinux-devel libssl-devel \
gettext-tools asciidoctor autoconf automake libtool pkg-config gcc make"

# Build the tools AND the C test programs with coverage, matching the ALT spec's
# %build options exactly (openssl backend, LUKS2 default, system libargon2,
# passwdqc), only adding --coverage/-O0. A build-root marker ($TARGET_SRC) lets
# the guest driver compute GCOV_PREFIX_STRIP so libgcov reproduces the build-tree
# layout under $GCOV_PREFIX relative to $TARGET_SRC for pairing.
target_build() {
    cd "$TARGET_SRC" || return 1

    local SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
    echo "cryptsetup: installing build requires (ALT spec BuildRequires)"
    $SUDO apt-get update >/dev/null 2>&1 || true
    # shellcheck disable=SC2086
    $SUDO apt-get install -y $CRYPTSETUP_BUILD_REQUIRES 2>&1 | tail -3 || \
        echo "⚠️  some build requires may be missing; configure will report" >&2

    # Locate the configure.ac (gear keeps it under cryptsetup/).
    local d=""
    if   [ -f configure.ac ];            then d="."
    elif [ -f cryptsetup/configure.ac ]; then d="cryptsetup"
    else d=$(find . -maxdepth 3 -name configure.ac -printf '%h\n' 2>/dev/null \
             | grep -iE 'cryptsetup' | head -1)
    fi
    [ -n "$d" ] || { echo "ERROR: cryptsetup configure.ac not found" >&2; return 1; }
    cd "$d" || return 1

    export CFLAGS="--coverage -O0 -g" LDFLAGS="--coverage"

    ( [ -x ./autogen.sh ] && ./autogen.sh ) || autoreconf -fi \
        || { echo "autoreconf failed" >&2; return 1; }

    # Options follow the ALT spec's %build (openssl backend, LUKS2 default, system
    # libargon2, passwdqc), with two deliberate changes needed by this harness:
    #   * --coverage/-O0 for faithful line counts;
    #   * --disable-shared --enable-static. The spec builds a SHARED libcryptsetup,
    #     so libtool emits the cryptsetup/veritysetup/integritysetup binaries as
    #     wrapper SCRIPTS that relink against the original (host) build path when
    #     run from elsewhere -- which fails inside the guest. Static linking gives
    #     real, relocatable ELF binaries; the objects are compiled identically, so
    #     coverage is unaffected. (The C check programs are already -static.)
    # Primary: spec-exact. Fallback: drop the optional man/passwdqc bits if a lean
    # environment lacks them, so the code still builds and is covered.
    ./configure \
        --disable-shared --enable-static \
        --with-crypto_backend=openssl \
        --with-default-luks-format=LUKS2 \
        --disable-internal-argon2 \
        --enable-libargon2 \
        --enable-passwdqc=/etc/passwdqc.conf \
      || ./configure \
        --disable-shared --enable-static \
        --with-crypto_backend=openssl \
        --with-default-luks-format=LUKS2 \
        --disable-internal-argon2 \
        --enable-libargon2 \
        --disable-asciidoc \
      || { echo "configure failed" >&2; return 1; }

    make -j"$(nproc)" || { echo "make failed" >&2; return 1; }
    # Build the C test programs (api-test, vectors-test, unit-*) with coverage so
    # the guest only RUNS them -- no compiler needed in the VM.
    make -C tests check-programs || echo "⚠️  check-programs build had errors" >&2

    printf '%s\n' "$TARGET_SRC" > "$TARGET_SRC/.gcov-build-root"
}
