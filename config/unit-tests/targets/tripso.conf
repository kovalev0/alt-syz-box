#
# Unit-tests target: tripso (xt_TRIPSO.ko + libxt_TRIPSO.so).
#
# TRIPSO is an iptables *target* (-j TRIPSO --to-cipso / --to-astra) that
# rewrites a packet's IP security-label option between CIPSO (IPOPT_CIPSO) and
# GOST R 58256-2018 / RFC 1108-Astra (IPOPT_SEC). It shares the label-parsing
# core with ipt-so's xt_so, but where xt_so only *matches*, TRIPSO *mangles* the
# option in place — so its coverage lives in the packet path (tripso_tg ->
# mangle_options -> write_cipso/write_astra), not in a checkentry.
#
# Source repository.
#   The sources live in the ALT "t/tripso" gear, which the maintainer
#   (vt@altlinux.org) mirrors verbatim to github.com/vt-alt/tripso — a *flat*
#   tree (Makefile + xt_TRIPSO.c + libxt_TRIPSO.c at the top level), exactly what
#   `make M=$TARGET_SRC modules` expects, just like ipt-so.
#
#   NOTE: the kernel-module *packaging* gear "kernel-modules-tripso-6.12" is NOT
#   usable here: its %prep unpacks a kernel-source-tripso tarball shipped by a
#   separate RPM, so a plain checkout contains only the .spec — no .c, no
#   Makefile — and the module build has nothing to compile.
#
#   To track ALT's packaged version (currently 1.2.2) instead of the public
#   mirror, swap the two lines below to:
#       TARGET_GIT_URL="git://git.altlinux.org/gears/t/tripso.git"
#       TARGET_GIT_REF="p11"
#   That gear is flat as well, so target_build() is unchanged; the 6.12 build
#   patch simply no-ops there (1.2.2 already includes <linux/unaligned.h>) and
#   apply_target_patches() skips it.
TARGET_NAME="tripso"
TARGET_GIT_URL="https://github.com/vt-alt/tripso.git"
TARGET_GIT_REF="sisyphus"
TARGET_COV_PATTERN="xt_TRIPSO"
TARGET_GUEST_TEST="tripso.sh"

# Kernel-6.12 build fixes for the module source live in
# patches/unit-tests/tripso/ (applied automatically by the orchestrator before
# target_build, the same way xtables-addons ships its kernel-bug fixes):
#   0001 - include <linux/unaligned.h> (the header moved in 6.12)
#   0002 - derive VERSION without requiring git tags in the checkout

# Full netfilter kconfig (TARGET_NETFILTER=1) covers IP_NF_IPTABLES,
# NETFILTER_XTABLES, IP_NF_SECURITY, IP_NF_RAW, IP_NF_MANGLE etc from the shared
# list. NETLABEL is specific to tripso (as for ipt-so): it lets the guest
# register a CIPSO DOI so IPOPT_CIPSO packets survive cipso_v4_validate() on the
# LOCAL_IN path in --to-astra mode. (The raw/PREROUTING rules the driver installs
# receive the labelled packets regardless, so basic translation coverage does
# not depend on NetLabel.)
TARGET_NETFILTER=1
TARGET_KCONFIG="NETLABEL NETWORK_SECMARK"

# netlabel-tools provides netlabelctl to register CIPSO DOI=1 (matching the
# module's default doi=1) so labelled CIPSO packets are not dropped by
# cipso_v4_validate() before the security/mangle hooks run.
TARGET_EXTRA_PACKAGES="netlabel-tools"

# Build the module against the gcov kernel and the libxt_TRIPSO.so userspace
# helper. Instrumentation comes from the kernel's CONFIG_GCOV_PROFILE_ALL=y, so
# no per-module gcov flags are needed (same as ipt-so and xtables-addons).
target_build() {
    make -C "$KERNEL_BUILD_DIR" M="$TARGET_SRC" \
        EXTRA_CFLAGS="-Wno-error" CONFIG_DEBUG_INFO=y modules
    ( cd "$TARGET_SRC" && make libxt_TRIPSO.so ) \
        || echo "Note: libxt_TRIPSO.so build failed; the guest driver will retry."
}
