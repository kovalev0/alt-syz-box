#
# Unit-tests target: kselftests — Linux kernel self-tests, x86_64.
# Tests are provided by the "kselftests" RPM installed into the guest image;
# no external sources need to be fetched or built on the host.

TARGET_NAME="kselftests"
# No external source; leave empty so fetch_target skips the git steps.
TARGET_GIT_URL=""
TARGET_GIT_REF=""

TARGET_COV_PATTERN=""
TARGET_GUEST_TEST="kselftests.sh"

# kernel-wide gcov: the in-guest driver runs lcov over /sys/kernel/debug/gcov.
# The orchestrator fetches the resulting coverage.info directly instead of
# collecting per-module .gcda files.
TARGET_COVERAGE_MODE="kernel"

# Full-kernel instrumentation: without GCOV_PROFILE_ALL only explicitly-marked
# translation units get .gcda data.
TARGET_KCONFIG="GCOV_PROFILE_ALL"

# Extra guest packages needed to run kselftests and generate the report.
TARGET_EXTRA_PACKAGES="kselftests lcov iproute2 ipvsadm jq nftables iperf3 fuse libfuse"

# Excluded from the default run: requires a full-kernel GCOV_PROFILE_ALL
# rebuild and much larger guest image.
# Run explicitly:  TARGETS="kselftests" ./run-all.sh unit-tests
TARGET_DEFAULT=0

# Nothing to build on the host; tests come from the installed kselftests RPM.
target_build() {
    echo "kselftests: no host build — tests are provided by the guest kselftests RPM."
}
