#
# Unit-tests target: dm-secdel — a device-mapper target that securely erases
# blocks on DISCARD. Out-of-tree module grafted onto the 6.12 kernel.
#
# Contract (see config/unit-tests/README.md): this file is sourced by
# scripts/06-run-unit-tests.sh with $TARGET_SRC set to the cloned source tree
# and $KERNEL_BUILD_DIR pointing at the gcov-instrumented kernel build.

TARGET_NAME="dm-secdel"
TARGET_GIT_URL="git://git.altlinux.org/gears/d/dm-secdel.git"
TARGET_GIT_REF="p11"

# lcov --extract pattern; keeps only this target's sources in the report.
TARGET_COV_PATTERN="dm-secdel"

# In-guest test driver (config/unit-tests/tests/<file>), run as root.
TARGET_GUEST_TEST="dm-secdel.sh"

# Kernel subsystems this module needs in the guest. The orchestrator aggregates
# these across enabled targets and enables them in the gcov kernel build.
TARGET_KCONFIG="MD BLK_DEV_DM DM_BUFIO BLK_DEV_LOOP EXT4_FS"

# Build the module against the gcov kernel; instrumentation comes from the
# kernel's GCOV_PROFILE_ALL, so no per-module flags are needed. The .ko and its
# .gcno are left in $TARGET_SRC alongside the sources.
target_build() {
    make -C "$KERNEL_BUILD_DIR" M="$TARGET_SRC" \
        EXTRA_CFLAGS="-Wno-error" CONFIG_DEBUG_INFO=y modules
}
