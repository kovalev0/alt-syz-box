#
# Unit-tests target: secure_delete — the THC "secure deletion" userspace suite
# (srm, sfill, sswap, smem). Out-of-tree *userspace* programs, NOT a kernel
# module: this is the one difference from dm-secdel/ipt-so/tripso/xtables-addons,
# and it drives the choice of TARGET_COVERAGE_MODE below.
#
#   srm    secure file removal: overwrite (Gutmann 38-pass by default), then
#          truncate + random-rename + unlink; recursive, hardlink-aware.
#   sfill  overwrite all free disk space (and free inodes) on a filesystem.
#   sswap  overwrite a swap *block device* (must be swapped off first).
#   smem   overwrite free RAM.
#
# The secure-wiping core lives in sdel-lib.c (sdel_overwrite / sdel_unlink /
# sdel_wipe_inodes / the pattern+random buffer fillers); each tool is a thin
# main() around it. The in-guest driver (tests/secure_delete.sh) therefore aims
# its coverage at sdel-lib.c plus every tool's option/dispatch paths.
#
# Source repository & ALT specifics (what the code BECOMES after patches).
#   ALT ships this as gears/s/secure_delete.git — upstream THC v3.1
#   (http://www.thc.org), packaged by Nikolay A. Fetisov <naf@altlinux.org>,
#   currently 3.1-alt3. Layout (.gear/rules): the THC tree is committed flat in a
#   secure_delete/ subdirectory and the ALT patches sit as *.patch at the gear
#   root (the spec builds the upstream tarball from that subdir via
#   "tar: secure_delete"). We clone the gear at p11, apply its patches and build
#   against the gcov toolchain. Two patches ship with the gear and are applied by
#   target_build() exactly as the spec's %prep does:
#     * secure_delete-3.1-configure-rand-file.patch — adds a -p/-P <file> option
#       to all four tools (use a supplied pattern file instead of /dev/urandom)
#       and a rewind-aware read loop in __sdel_random_buf; introduces the global
#       random_dev. This is live code, so the driver exercises -p too.
#     * secure_delete-3.1-kernel_module-alt.patch — edits only the Makefile's
#       install target (drops the "all" dep so the kernel module is not built).
#   The spec's %build is "make sdel-lib.o srm sfill sswap smem" — i.e. the ALT
#   package is the four *userspace* tools only; we build the same set.
#
#   NOTE: the ancient Linux kernel module sdel-mod.c still present in the THC tree
#   targets 2.2/2.4 kernels, will not build on 6.12, and is NOT part of the ALT
#   package's build — so it is intentionally not compiled here. The modern
#   in-kernel equivalent (secure erase on DISCARD) is covered by dm-secdel.
#
# Contract: see config/unit-tests/README.md. This file is sourced by
# scripts/06-run-unit-tests.sh with $TARGET_SRC set to the cloned source tree
# and $KERNEL_BUILD_DIR pointing at the gcov-instrumented kernel build.

TARGET_NAME="secure_delete"
TARGET_GIT_URL="git://git.altlinux.org/gears/s/secure_delete.git"
TARGET_GIT_REF="p11"

# lcov --extract pattern; the build tree lives under .../secure_delete/src so
# this keeps only the suite's own sources (srm.c, sfill.c, sswap.c, smem.c,
# sdel-lib.c) in the report.
TARGET_COV_PATTERN="secure_delete"

# In-guest test driver (config/unit-tests/tests/<file>), run as root.
TARGET_GUEST_TEST="secure_delete.sh"

# USERSPACE coverage: these binaries are compiled with gcc --coverage (below) and
# write their .gcda to the filesystem at exit via libgcov — there is nothing in
# the kernel's gcov debugfs to collect. The orchestrator's "userspace" branch
# pulls the .gcda the guest driver staged under $GCOV_USERSPACE_DIR and pairs them
# with the .gcno left here by target_build. (Contrast: dm-secdel etc. use the
# default "module" mode; kselftests uses "kernel" mode.)
TARGET_COVERAGE_MODE="userspace"

# Kernel symbols the guest needs so the driver can exercise the tools against
# real objects: a loop device standing in for a disk (srm/sfill) and for a swap
# block device (sswap), and ext4 for the sfill free-space/inode wipe. These are
# aggregated across enabled targets and enabled in the gcov kernel build. No
# netfilter here. (losetup/blkdiscard/mkfs.ext4/mkswap/mkfifo come from the base
# guest package set, so no TARGET_EXTRA_PACKAGES are required.)
TARGET_KCONFIG="BLK_DEV_LOOP EXT4_FS"

# Build the four userspace tools with coverage instrumentation, leaving the
# binaries AND their .gcno in $TARGET_SRC. We compile the .c directly instead of
# driving the upstream Makefile, for three reasons: (1) gcov needs --coverage on
# every translation unit, which the stock Makefile does not pass; (2) the stock
# "all" target also builds sdel-mod.o (the 2.x-kernel module) and would abort on
# a 6.12 toolchain; (3) compiling here guarantees the .gcno/.gcda build path is
# exactly $TARGET_SRC, which is what the host-side gcov_report() pairs against.
# -O0 keeps line coverage faithful; -Wno-error tolerates the 2003-era warnings.
target_build() {
    local CF="--coverage -O0 -g -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE \
-Wno-error -Wno-implicit-function-declaration"

    cd "$TARGET_SRC" || return 1

    # Locate the sources. The ALT gear (.gear/rules: "tar: secure_delete") keeps
    # the upstream THC 3.1 tree committed flat in a secure_delete/ subdirectory,
    # with the ALT patches as *.patch at the gear root. A plain clone therefore
    # has sdel-lib.c under secure_delete/, not at the top. We also handle a gear
    # that ships the sources as a committed tarball, or already flat at the top.
    # Copy the WHOLE source directory up (not just *.c/*.h) so the patches — which
    # also touch README — apply cleanly.
    if [ ! -f sdel-lib.c ]; then
        local t
        t=$(ls -1 *.tar.* 2>/dev/null | head -1)
        if [ -n "$t" ]; then
            echo "secure_delete: unpacking upstream tarball $t"
            tar xf "$t" 2>/dev/null || true
        fi
        if [ ! -f sdel-lib.c ]; then
            local d
            d=$(find . -maxdepth 3 -name sdel-lib.c -printf '%h\n' 2>/dev/null | head -1)
            if [ -n "$d" ] && [ "$d" != "." ]; then
                echo "secure_delete: using source dir $d"
                cp -f "$d"/* . 2>/dev/null || true
            fi
        fi
    fi

    if [ ! -f sdel-lib.c ]; then
        echo "ERROR: secure_delete sources (sdel-lib.c) not found after fetch/unpack." >&2
        echo "       The gear layout may differ; adjust target_build in $0." >&2
        return 1
    fi

    # Apply the gear's own patches, reproducing the spec's %prep. Currently:
    #   secure_delete-3.1-configure-rand-file.patch  -> adds the -p/-P option (a
    #        user pattern file in place of /dev/urandom) to all four tools and the
    #        rewind-aware read loop in __sdel_random_buf — real code we want to
    #        cover, so it must be applied before building.
    #   secure_delete-3.1-kernel_module-alt.patch    -> edits only the Makefile's
    #        install target; harmless here (we do not use the Makefile).
    # The strip level differs between them, so try -p1 then -p0; --forward skips
    # any patch already applied by the framework's patches/unit-tests hook.
    # --no-backup-if-mismatch keeps patch from scattering *.orig backups into the
    # build tree when a hunk applies with fuzz/offset.
    local PFLAGS="--batch --forward --no-backup-if-mismatch -r /dev/null"
    local p
    for p in *.patch; do
        [ -e "$p" ] || continue
        if patch -p1 $PFLAGS <"$p" >/dev/null 2>&1; then
            echo "  ✅ applied $p (-p1)"
        elif patch -p0 $PFLAGS <"$p" >/dev/null 2>&1; then
            echo "  ✅ applied $p (-p0)"
        else
            echo "  ℹ️  $p not applied (already applied or N/A)"
        fi
    done
    rm -f ./*.orig 2>/dev/null   # in case an older patch ignored the flag

    # Shared library object (holds the real wiping logic -> the coverage we want).
    gcc $CF -c sdel-lib.c -o sdel-lib.o || return 1

    # One binary per tool; skip any the tree happens not to ship.
    local t rc=0
    for t in srm sfill sswap smem; do
        if [ -f "$t.c" ]; then
            gcc $CF -o "$t" "$t.c" sdel-lib.o || { echo "⚠️  $t failed to build"; rc=1; }
        fi
    done
    return $rc
}
