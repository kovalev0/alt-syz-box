#
# Copyright (C) 2026 Vasiliy Kovalev <kovalev@altlinux.org>
#
# Unit-tests target: iptables -- the netfilter userspace administration tools
# (iptables/ip6tables/arptables/ebtables, legacy + nft variants, plus
# iptables-save/restore and the xlate translators). Userspace counterpart of the
# out-of-tree netfilter *module* targets (ipt-so, tripso, xtables-addons): those
# add kernel matches/targets, iptables drives netfilter from userspace. Userspace
# package => coverage via gcc --coverage (TARGET_COVERAGE_MODE=userspace).
#
# What is measured: libxtables (option/match/target parsing), libiptc (legacy
# rule blob handling), the nft back end (nft-ruleparse, nft-cache,
# xtables-restore/save/monitor) and all extensions/libxt_*.c / libip6t_*.c /
# libebt_*.c / libarpt_*.c parsers and printers.
#
# Tests: the project's OWN upstream suite -- the TESTS of its autotools
# "make check" -- reused verbatim and run in the guest against the freshly built
# in-tree binaries (the harness points XTABLES_LIBDIR/PATH at the build tree, so
# coverage lands in our --coverage objects): xlate-test.py, iptables-test.py (the
# 144 extensions/*.t, legacy+nft) and iptables/tests/shell/run-tests.sh.
#
# Source repository: ALT gear gears/i/iptables.git. Sources are committed flat at
# the gear root (configure.ac, extensions/, libxtables/, libiptc/, iptables/, the
# *.py test drivers); no ALT .patch files ship for this gear, so target_build
# just autoreconf+configure+make.
#
# Contract: see config/unit-tests/README.md. Sourced by 06-run-unit-tests.sh
# with $TARGET_SRC = the cloned tree and $KERNEL_BUILD_DIR = the gcov kernel.

TARGET_NAME="iptables"
TARGET_GIT_URL="git://git.altlinux.org/gears/i/iptables.git"
TARGET_GIT_REF="p11"

# lcov --extract scope: $TARGET_SRC is .../unit-tests/iptables/src, so every
# source path contains "iptables" and is kept; /usr/include headers are dropped.
TARGET_COV_PATTERN="iptables"

TARGET_GUEST_TEST="iptables.sh"

# Full netfilter kernel (shared config/unit-tests/netfilter-kconfig.list) gives
# legacy x_tables, nf_tables, arptables, bridge/ebtables, conntrack and NAT.
# Add the legacy bridge ebtables table cores so the ebtables *.t files load under
# the legacy variant too (the nft variant is already covered by NFT_BRIDGE_* in
# the shared list; the arptables symbols are already in the shared list).
TARGET_NETFILTER=1
TARGET_KCONFIG="BRIDGE_NF_EBTABLES BRIDGE_EBT_T_FILTER BRIDGE_EBT_T_NAT \
BRIDGE_EBT_BROUTE"

# Guest runtime: the test drivers (python3), helpers the suites call (iproute2
# for "ip netns", nftables/ebtables for cross-checks, iputils), and the shared
# libraries the in-tree binaries link against. ALT package names; the image build
# installs them one by one and tolerates any that are absent.
TARGET_EXTRA_PACKAGES="python3 iproute2 nftables ebtables iputils \
libmnl libnftnl libnfnetlink libnetfilter_conntrack libpcap"

TARGET_COVERAGE_MODE="userspace"

# Build dependencies this package needs IN THE CONTAINER (the build host), taken
# verbatim from the ALT spec's BuildRequires. The alt-syz-box container is a plain
# dev container without these -devel packages, so target_build installs them
# first (idempotent; apt-get is a no-op when already present). Out-of-tree module
# targets do not need this; autotools userspace packages do.
IPTABLES_BUILD_REQUIRES="libpcap-devel libnfnetlink-devel \
libnetfilter_conntrack-devel bison flex libmnl-devel libnftnl-devel \
autoconf automake libtool pkg-config gcc make"

# Build the whole tree with coverage. Options follow the ALT spec's %build
# (--enable-nftables [%def_enable nftables], --enable-bpf-compiler,
# --disable-libipq, --sbindir=/sbin, --with-xtlibdir=/lib/iptables; -fno-strict-
# aliasing), with TWO deliberate changes needed by this harness:
#   * --coverage/-O0 for faithful line counts;
#   * --disable-shared --enable-static instead of the spec's --disable-static.
#     The spec builds SHARED libs, so libtool emits the iptables binaries as
#     wrapper SCRIPTS that, when run before "make install" and from a different
#     directory, cd into the original (host) build path and relink -- which fails
#     inside the guest (the host path does not exist there: "cd: .../iptables: No
#     such file or directory", "ld: cannot find ...o"). Static linking produces
#     real, relocatable ELF binaries that run in the guest unchanged; the objects
#     are compiled identically, so coverage is unaffected.
# A build-root marker lets the guest driver compute GCOV_PREFIX_STRIP so libgcov
# reproduces the build-tree layout under $GCOV_PREFIX at paths relative to
# $TARGET_SRC, matching the .gcno for pairing (see tests/iptables.sh).
target_build() {
    cd "$TARGET_SRC" || return 1

    local SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
    echo "iptables: installing build requires (ALT spec BuildRequires)"
    $SUDO apt-get update >/dev/null 2>&1 || true
    # shellcheck disable=SC2086
    $SUDO apt-get install -y $IPTABLES_BUILD_REQUIRES 2>&1 | tail -3 || \
        echo "⚠️  some build requires may be missing; configure will report" >&2

    export CFLAGS="--coverage -O0 -g -fno-strict-aliasing"
    export LDFLAGS="--coverage"

    if [ -x ./autogen.sh ]; then ./autogen.sh; else autoreconf -fi; fi \
        || { echo "autoreconf failed" >&2; return 1; }

    ./configure \
        --disable-shared \
        --enable-static \
        --enable-nftables \
        --enable-bpf-compiler \
        --disable-libipq \
        --sbindir=/sbin \
        --with-xtlibdir=/lib/iptables \
        || { echo "configure failed" >&2; return 1; }

    make -j"$(nproc)" V=1 || { echo "make failed" >&2; return 1; }

    printf '%s\n' "$TARGET_SRC" > "$TARGET_SRC/.gcov-build-root"
}
