#
# Unit-tests target: xtables-addons (25+ out-of-tree iptables matches/targets).
# Kernel gcov instrumentation comes from CONFIG_GCOV_PROFILE_ALL=y which is
# enabled by 02-build-kernel.sh for all gcov-mode builds.

TARGET_NAME="xtables-addons"
TARGET_GIT_URL="git://git.altlinux.org/gears/x/xtables-addons.git"
TARGET_GIT_REF="p11"

TARGET_COV_PATTERN="xt_"
TARGET_GUEST_TEST="xtables-addons.sh"

TARGET_NETFILTER=1
TARGET_KCONFIG="TEXTSEARCH TEXTSEARCH_KMP TEXTSEARCH_BM TEXTSEARCH_FSM"

target_build() {
    ( cd "$TARGET_SRC"

      if [ ! -f configure.ac ] && [ ! -x configure ]; then
          t=$(ls -1 *.tar.* 2>/dev/null | head -1)
          [ -n "$t" ] && { echo "Unpacking upstream tarball $t"; tar xf "$t"; }
      fi
      if [ ! -f configure.ac ] && [ ! -x configure ]; then
          d=$(find . -maxdepth 3 -name configure.ac -printf '%h\n' 2>/dev/null | head -1)
          [ -n "$d" ] && { echo "Using source dir $d"; cd "$d"; }
      fi

      if [ ! -x ./configure ]; then
          if [ -x ./autogen.sh ]; then ./autogen.sh
          elif [ -f configure.ac ]; then autoreconf -fi
          fi
      fi

      if [ ! -x ./configure ]; then
          echo "ERROR: could not locate or generate ./configure for xtables-addons." >&2
          exit 1
      fi

      ./configure --with-kbuild="$KERNEL_BUILD_DIR"
      make -j"$(nproc)"
      make -j"$(nproc)" modules 2>/dev/null || true )
}
