# Unit-tests target: ipt-so (xt_so.ko + libxt_so.so).

TARGET_NAME="ipt-so"
TARGET_GIT_URL="git://git.altlinux.org/gears/i/ipt-so.git"
TARGET_GIT_REF="p11"
TARGET_COV_PATTERN="xt_so"
TARGET_GUEST_TEST="ipt-so.sh"

# Full netfilter kconfig (TARGET_NETFILTER=1) covers IP_NF_IPTABLES,
# NETFILTER_XTABLES, IP_NF_SECURITY etc from the shared list.
# NETLABEL and NETWORK_SECMARK are specific to ipt-so and not in the shared list.
TARGET_NETFILTER=1
TARGET_KCONFIG="NETLABEL NETWORK_SECMARK"

# netlabel-tools provides netlabelctl to register CIPSO DOI=1 so that raw
# CIPSO packets are not dropped by cipso_v4_validate() before reaching netfilter.
TARGET_EXTRA_PACKAGES="netlabel-tools"

target_build() {
    make -C "$KERNEL_BUILD_DIR" M="$TARGET_SRC" \
        EXTRA_CFLAGS="-Wno-error" CONFIG_DEBUG_INFO=y modules
    ( cd "$TARGET_SRC" && make libxt_so.so ) \
        || echo "Note: libxt_so.so build failed; the guest driver will retry."
}
